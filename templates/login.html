<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex justify-center items-center h-screen bg-gray-100">

<form method="post" class="bg-white p-6 rounded shadow">

    <h1 class="text-xl mb-4">Connexion</h1>

    <input name="username" placeholder="Username" class="border p-2 mb-2 w-full">

    <input name="password" type="password" placeholder="Password" class="border p-2 mb-2 w-full">

    <button class="bg-blue-500 text-white p-2 w-full">Login</button>

</form>

</body>
</html>
