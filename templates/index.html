<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Maintenance AI</title>

    <style>

        body{
            background:#0f172a;
            font-family:Arial;
            color:white;
            margin:0;
            padding:0;
        }

        .chat-container{
            width:80%;
            max-width:900px;
            margin:auto;
            margin-top:20px;
        }

        .title{
            text-align:center;
            margin-bottom:20px;
        }

        .chat-box{
            background:#1e293b;
            height:500px;
            overflow-y:auto;
            padding:20px;
            border-radius:12px;
        }

        .user-message{
            background:#2563eb;
            padding:12px;
            border-radius:10px;
            margin:10px 0;
            text-align:right;
        }

        .ai-message{
            background:#334155;
            padding:12px;
            border-radius:10px;
            margin:10px 0;
        }

        .input-zone{
            display:flex;
            margin-top:15px;
        }

        input{
            flex:1;
            padding:15px;
            border:none;
            border-radius:10px;
            font-size:16px;
        }

        button{
            background:#3b82f6;
            color:white;
            border:none;
            padding:15px;
            margin-left:10px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#2563eb;
        }

    </style>

</head>

<body>

<div class="chat-container">

    <div class="title">
        <h1>🤖 Maintenance AI</h1>
        <p>Assistant intelligent de maintenance industrielle</p>
    </div>

    <div class="chat-box" id="chat-box">

    </div>

    <div class="input-zone">

        <input type="text" id="message"
        placeholder="Décrivez le problème industriel...">

        <button onclick="sendMessage()">
            Envoyer
        </button>

    </div>

</div>

<script>

async function sendMessage(){

    let message = document.getElementById("message").value

    let chatBox = document.getElementById("chat-box")

    chatBox.innerHTML += `
        <div class="user-message">
            ${message}
        </div>
    `

    let response = await fetch("/chat", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:message
        })

    })

    let data = await response.json()

    chatBox.innerHTML += `
        <div class="ai-message">
            ${data.response}
        </div>
    `

    document.getElementById("message").value = ""

    chatBox.scrollTop = chatBox.scrollHeight
}

</script>

</body>
</html>
